projects:
  - name: Terraform CI/CD on AWS (personal project)
    year: "2026"
    url: https://github.com/BeaconNicolas/terraform-cicd-aws
    tags: [terraform, aws, ci-cd, codepipeline, codebuild, github-actions, oidc, iam, security, docker, ecr, testing]
    bullets:
      - A merge to dev, int or prod signs in to AWS with GitHub OIDC (no stored keys) and starts that environment's CodePipeline V2 through S3 and EventBridge, with test, plan, manual approval and apply stages.
      - Least-privilege IAM with confused-deputy conditions, per-environment deployer roles without delete permissions, a destroy guard on every plan and S3-native state locking.
      - Offline terraform test suites with mock providers, a pinned and checksum-verified tools image, and a design that stays inside the AWS free tier.

  - name: Lending Club credit policy classification
    year: "2023"
    url: https://github.com/BeaconNicolas/Data_Science
    tags: [machine-learning, classification, python, scikit-learn, tensorflow, keras, statistics]
    bullets:
      - Classified whether borrowers meet Lending Club's credit-underwriting criteria from 9,578 loan records, screening features with t-tests, chi-square tests and VIF.
      - Compared logistic regression (91% test accuracy) with a GridSearchCV-tuned random forest (99%), and built a Keras/TensorFlow network with early stopping.

  - name: NYC 311 customer service requests
    year: "2023"
    url: https://github.com/BeaconNicolas/Data_Science
    include: false
    tags: [data-analysis, python, pandas, scipy, statistics, data-cleaning]
    bullets:
      - Cleaned and analysed 364,558 public service requests, engineered a closing-time feature, and used ANOVA and chi-square tests to compare response times across complaint types and locations.

  - name: Greener manufacturing feature preparation
    year: "2023"
    url: https://github.com/BeaconNicolas/Data_Science
    include: false
    tags: [machine-learning, feature-engineering, pca, xgboost, python]
    bullets:
      - Prepared about 380 anonymised car-configuration features to predict test-bench time, using label encoding, standardisation and PCA, and set up XGBoost and linear regression models.

