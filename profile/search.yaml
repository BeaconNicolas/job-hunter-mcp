# What to search for and how strict the daily alert is.
# Matching uses the skills and experience in cv.yaml; this file only steers the search.

# A job whose title contains one of these scores higher.
target_titles:
  - platform engineer
  - devops engineer
  - devops
  - cloud engineer
  - aws engineer
  - aws developer
  - cloud developer
  - site reliability engineer
  - sre
  - infrastructure engineer
  - mlops engineer
  - data engineer

# Jobs whose title contains any of these are skipped.
exclude_title_words:
  - principal
  - director
  - head of
  - vice president
  - intern
  - internship

# Roughly how many years of relevant experience you have. Jobs asking for much
# more are still shown, but score lower and are flagged.
experience_years: 3

min_score: 55   # 0-100: below this, a job is not sent to WhatsApp
max_alerts: 5   # most jobs per daily WhatsApp message

# Adzuna: jobs in South Africa. Needs an API key (README). Every search below is one
# API call per run. Without a paid plan Adzuna allows only 25 calls in total, so the
# default is a single call that matches any of the words in any_of.
adzuna:
  country: za
  where: ""          # e.g. "Gauteng" to narrow it; empty means all of South Africa
  max_days_old: 3
  any_of: [devops, terraform, aws, cloud, sre]
  queries: []        # extra searches where all words must match, e.g. "platform engineer"

# Remotive: remote jobs. No key needed. Remotive asks for only a few requests a
# day, so the daily alert makes one request per category and search below.
remotive:
  categories:
    - devops
  searches: []
  # Keep jobs whose "candidate location" mentions one of these.
  allowed_locations:
    - worldwide
    - anywhere
    - global
    - africa
    - south africa
    - emea
