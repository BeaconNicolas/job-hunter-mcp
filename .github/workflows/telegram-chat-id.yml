# One-time helper: your Telegram bot sends you your chat ID.
# Before running: save TELEGRAM_BOT_TOKEN as a repository secret, then open your
# bot in Telegram, tap Start and send it "hi". The ID is sent only to Telegram,
# never printed here, because this repository's logs are public.
name: Find my Telegram chat ID

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chat-id:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      - name: Send the chat ID to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: uv run --frozen job-hunter-telegram-id
