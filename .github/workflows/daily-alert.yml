# Every morning: search for jobs, rank them against profile/cv.yaml and send the
# best new matches to your phone (Telegram, and WhatsApp if configured). Run it by hand from the Actions tab too
# (tick "dry run" to test the search without sending anything).
name: Daily job alert

on:
  schedule:
    - cron: "23 4 * * *" # 06:23 in South Africa (UTC+2)
  workflow_dispatch:
    inputs:
      dry_run:
        description: Search and list the matches, but send nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      # Remembers which jobs were already sent, so each job is sent only once.
      - name: Restore the list of jobs already sent
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state
          key: seen-jobs-${{ github.run_id }}
          restore-keys: seen-jobs-

      - name: Search, rank and send
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          WHATSAPP_TEMPLATE: ${{ vars.WHATSAPP_TEMPLATE }}
          WHATSAPP_TEMPLATE_LANG: ${{ vars.WHATSAPP_TEMPLATE_LANG }}
          # Logs of a public repository are public: job details only go to WhatsApp
          # unless this variable is "true".
          ALERT_DETAILS_IN_LOGS: ${{ vars.ALERT_DETAILS_IN_LOGS }}
        run: |
          args=()
          if [ "${DRY_RUN}" = "true" ]; then args+=(--dry-run); fi
          uv run --frozen job-hunter-alert "${args[@]}"

      - name: Save the list of jobs already sent
        if: always() && hashFiles('state/seen_jobs.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state
          key: seen-jobs-${{ github.run_id }}
