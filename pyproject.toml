[project]
name = "job-hunter-mcp"
version = "0.1.0"
description = "MCP server and daily phone alert (Telegram or WhatsApp) that find jobs matching my CV and tailor the CV to a job, using only facts from the CV."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic==2.7.0",
  "httpx==0.28.1",
  "mcp==2.3.0",
  "python-docx==1.2.0",
  "pyyaml==6.0.3",
]

[project.scripts]
job-hunter-mcp = "job_hunter.server:main"
job-hunter-alert = "job_hunter.alert:main"
job-hunter-render = "job_hunter.render:cli"
job-hunter-telegram-id = "job_hunter.telegram:chat_id_cli"

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.4",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_hunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
